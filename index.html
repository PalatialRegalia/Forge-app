<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Forge">
    <meta name="theme-color" content="#0a0a0a">

    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="manifest" href="manifest.json">

    <title>Forge Kinetic</title>
    <style>
        :root {
            /* Surfaces and text. Every value below is checked against WCAG:
               body text >= 4.5:1, large numerals and control edges >= 3:1. */
            --bg: #0a0a0a;
            --surface: #1c1c1e;
            --text: #f4f4f5;          /* 15.5:1 on surface */
            --text-muted: #b4b4bd;    /* 8.3:1 on surface (was #a1a1aa, 6.6:1) */

            /* Edges. --border is a calm container edge; --border-strong is for
               interactive controls, whose boundary is the only thing that says
               "this is tappable", so it must clear 3:1. --rule is decorative. */
            --border: #3f3f46;        /* container edge */
            --border-strong: #6b6b75; /* control edge, 3.2:1 on surface */
            --rule: #2f2f34;          /* internal dividers only */

            /* Signal system: one red hue, two roles. A single value cannot be
               both a fill under white text and readable text on near-black, so
               the hue is shared and the lightness splits by role. */
            --accent: #f2555f;        /* red as ink: 5.1:1 on surface, 5.9:1 on bg */
            --action: #c1121f;        /* red as fill: white on it is 6.2:1 */
            --on-action: #ffffff;
            --accent-dim: rgba(242, 85, 95, 0.18);

            /* Exactly one signal colour for "optional", and nothing else. */
            --optional: #ffb703;
            --on-optional: #0a0a0a;

            /* Translucent surface for the sticky timer. */
            --surface-glass: rgba(28, 28, 30, 0.95);

            /* Ink for the one texture layer. Measured against --surface: with
               it, body text is 14.6:1 and muted text 7.8:1, both still AAA. */
            --texture-ink: rgba(255, 255, 255, 0.022);

            /* Geometry: one radius scale, three steps. Tighter than the mixed
               4/6/8/10/12/16px it replaces - a tool, not a consumer app. */
            --radius-xs: 4px;         /* badges, progress track */
            --radius-sm: 6px;         /* small controls */
            --radius-md: 8px;         /* panels, cards, primary buttons */

            /* Type: one seven-step scale plus a display size for the timer, in
               place of the sixteen ad-hoc sizes it replaces. */
            --fs-xs: 0.7rem;          /* labels, badges */
            --fs-sm: 0.8rem;          /* secondary text */
            --fs-base: 0.9rem;        /* body */
            --fs-md: 1rem;            /* primary body, controls */
            --fs-lg: 1.2rem;          /* buttons, headings */
            --fs-xl: 1.5rem;          /* exercise titles */
            --fs-display: 3rem;       /* the session timer */
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 100px; touch-action: manipulation; }

        /* Touch targets: every control clears 48px on its shortest side so it can
           be hit with a thumb, a glove, or a shaky hand mid-set. WCAG 2.5.8 asks
           for 24px; this is deliberately double. `touch-action: manipulation`
           kills the double-tap-to-zoom delay without disabling pinch-zoom. */
        button, select, .adj-btn { min-height: 48px; touch-action: manipulation; }
        /* Selection stays available for text worth copying - cue lines, the
           session summary - and is disabled only on controls, which have
           nothing to copy. */
        button, select { user-select: none; -webkit-user-select: none; }

        header { padding: 20px; text-align: center; border-bottom: 1px solid var(--rule); background: var(--surface); background-image: repeating-linear-gradient(135deg, var(--texture-ink) 0 1px, transparent 1px 7px); position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .header-icon { width: 24px; height: 24px; }
        /* Absolutely positioned so it does not disturb the centred wordmark.
           Muted colour: it is a preference, not a call to action. */
        .sound-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; padding: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .sound-toggle .glyph { width: 22px; height: 22px; }
        header h2 { margin: 0; font-size: var(--fs-lg); letter-spacing: 1px; text-transform: uppercase; }
        .progress-indicator { font-size: var(--fs-sm); color: var(--text-muted); margin-top: 4px; }

        .controls { display: flex; flex-direction: column; gap: 15px; padding: 20px; align-items: center; }
        select { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); padding: 14px; border-radius: var(--radius-sm); font-size: var(--fs-md); width: 100%; max-width: 400px; outline: none; appearance: none; text-align: center; font-weight: 600; }
        .category-label { font-size: var(--fs-sm); color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: -5px; }

        .preview-container { background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); width: 100%; max-width: 400px; padding: 15px; margin-top: -5px; }
        .preview-title { font-size: var(--fs-sm); color: var(--accent); text-transform: uppercase; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px;}
        .preview-list { list-style: none; padding: 0; margin: 0; font-size: var(--fs-md); color: var(--text-muted); }
        .preview-list li { margin-bottom: 6px; display: flex; align-items: flex-start; gap: 8px; }
        /* Iconography ------------------------------------------------------
           One hand-drawn glyph set: 24px grid, 2px stroke, currentColor, no
           fills. This replaces platform emoji, which the OS drew and the app
           did not control - flag sequences became bare letter pairs on Windows
           and several combinations degraded to tofu on older Android. */
        .glyph { display: block; width: 100%; height: 100%; }
        .preview-origin { display: block; width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--text-muted); }
        .preview-opt { font-size: var(--fs-xs); background: var(--optional); color: var(--on-optional); padding: 2px 6px; border-radius: var(--radius-xs); font-weight: bold; margin-left: auto; }

        .btn-start-workout { background: var(--action); color: var(--on-action); border: none; padding: 16px; border-radius: var(--radius-md); font-size: var(--fs-lg); font-weight: bold; width: 100%; max-width: 400px; cursor: pointer; transition: transform 0.1s; margin-top: 5px; }
        .btn-start-workout:active { transform: scale(0.97); }

        .card-container { padding: 15px; max-width: 500px; margin: 0 auto; display: none; }
        .card { background: var(--surface); border-radius: var(--radius-md); padding: 24px; display: none; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .card.active { display: block; animation: slideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

        /* Imagery -----------------------------------------------------------
           The app ships no raster images: a photo is dead weight offline and a
           licensing obligation. Identity comes from two vector layers instead,
           both measured so they cannot erode text contrast. */
        /* A large ghost of the day's glyph, clipped by the card itself. */
        .card-watermark { position: absolute; right: -24px; bottom: -24px; width: 200px; height: 200px; color: var(--text); opacity: 0.055; pointer-events: none; }

        .empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; color: var(--text-muted); text-align: center; }
        .empty-mark { width: 44px; height: 44px; opacity: 0.6; }

        /* Progress Bar for Time-Based Exercises */
        .ex-progress-bg { display: none; background: var(--bg); height: 12px; border-radius: var(--radius-xs); margin-top: 15px; overflow: hidden; border: 1px solid var(--border-strong); }
        .ex-progress-fill { background: var(--action); height: 100%; width: 0%; transition: width 0.5s linear; }
        .ex-progress-controls { display: none; align-items: center; justify-content: space-between; margin-top: 10px; }
        .ex-progress-time { font-size: var(--fs-lg); font-weight: bold; font-variant-numeric: tabular-nums; }
        .ex-progress-btn { background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); padding: 8px 16px; border-radius: var(--radius-sm); font-weight: bold; cursor: pointer; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .exercise-title { margin: 0; font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; }
        .badge-optional { background: var(--optional); color: var(--on-optional); font-size: var(--fs-xs); padding: 3px 8px; border-radius: var(--radius-xs); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; align-self: flex-start; margin-top: 6px;}
        .exercise-origin { display: block; width: 30px; height: 30px; padding: 8px; background: var(--bg); border-radius: var(--radius-md); color: var(--text); border: 1px solid var(--border); }

        .adjuster-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .adjuster { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .adj-label { font-weight: 600; color: var(--text-muted); width: 60px; text-transform: uppercase; font-size: var(--fs-base); letter-spacing: 0.5px;}
        .adj-controls { display: flex; align-items: center; gap: 15px; }
        .adj-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border-strong); width: 48px; height: 48px; border-radius: var(--radius-sm); font-size: var(--fs-xl); font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
        .adj-btn:active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
        .adj-val { font-size: var(--fs-xl); font-weight: 700; min-width: 36px; text-align: center; font-variant-numeric: tabular-nums; }

        .cues { background: var(--bg); padding: 16px; border-radius: var(--radius-md); font-size: var(--fs-md); line-height: 1.5; color: var(--text-muted); border-left: 4px solid var(--action); margin-top: 15px; }

        .actions { display: flex; gap: 12px; margin-top: 24px; }
        button.action-btn { flex: 1; padding: 18px; border: none; border-radius: var(--radius-md); font-size: var(--fs-lg); font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        button.action-btn:active { transform: scale(0.97); }
        /* Note the two-class selector: a bare `.btn-skip` loses the border to
           `button.action-btn { border: none }` on specificity, which is why the
           Skip button rendered borderless before. */
        .action-btn.btn-skip { background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); }
        .btn-done { background: var(--action); color: var(--on-action); }

        /* History & Export UI */
        .history-container { max-width: 500px; margin: 10px auto; padding: 0 15px; display: none; }
        .history-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border-strong); padding: 16px; border-radius: var(--radius-md); width: 100%; font-size: var(--fs-md); font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .history-list { background: var(--surface); border-radius: var(--radius-md); padding: 15px; border: 1px solid var(--border); margin-bottom: 20px; font-size: var(--fs-base); max-height: 300px; overflow-y: auto;}
        .history-item { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
        .history-item:last-child { border-bottom: none; }
        .btn-export { background: var(--surface); color: var(--text); width: 100%; padding: 16px; border-radius: var(--radius-md); font-size: var(--fs-lg); font-weight: 600; border: 1px solid var(--border-strong); cursor: pointer;}
        /* Destructive action: red ink on a neutral body. Reserving the red fill
           for the single primary action keeps "danger" legible without letting
           it compete with "start session" / "complete". */
        .action-btn.btn-danger { background: var(--surface); color: var(--accent); border: 1px solid var(--border-strong); width: 100%; }
        .action-btn.btn-danger:active { background: var(--accent-dim); }
        /* Destroying the logbook is irreversible, so it gets its own space below
           a rule - a mis-tap while reaching for "export" cannot reach it. */
        .history-danger { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--rule); }

        .sticky-timer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface-glass); backdrop-filter: blur(10px); padding: 15px 20px; border-top: 1px solid var(--rule); display: none; justify-content: space-between; align-items: center; z-index: 100; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .timer-info { display: flex; flex-direction: column; }
        .timer-label { font-size: var(--fs-sm); color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .timer-display { font-size: var(--fs-display); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; margin-top: 4px;}
        .timer-controls { display: flex; gap: 8px; }

        .summary-stats { display: flex; gap: 10px; margin: 20px 0; text-align: center; }
        .stat-box { flex: 1; background: var(--bg); padding: 12px 5px; border-radius: var(--radius-md); border: 1px solid var(--border); }
        .stat-label { font-size: var(--fs-xs); color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .stat-value { font-size: var(--fs-lg); font-weight: bold; }

        @keyframes slideIn { from { opacity: 0; transform: scale(0.98) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body>

    <header>
        <img src="icon.svg" class="header-icon" alt="">
        <div>
            <h2>FORGE KINETIC</h2>
            <div class="progress-indicator" id="progressIndicator">Awaiting Start</div>
        </div>
        <button class="sound-toggle" id="soundToggle" type="button" onclick="toggleSound()" aria-pressed="true" aria-label="Cue sound on"></button>
    </header>

    <div class="controls" id="topControls">
        <span class="category-label">Select Programming</span>
        <select id="workoutDay" onchange="updatePreview()">
            <option value="A">Day A (Strength & Rotation)</option>
            <option value="B">Day B (Volume & Flow)</option>
            <option value="C">Day C (Carries & Pulling)</option>
            <optgroup label="Cultural Immersions (Heritage)">
                <option value="Persia">Persia: House of Strength</option>
                <option value="India">India: The Akhara</option>
                <option value="Russia">Russia: The Frozen Field</option>
                <option value="Japan">Japan: The Sacred Ring</option>
                <option value="China">China: The Courtyard</option>
                <option value="Scandinavia">Scandinavia: The Windswept Hill</option>
                <option value="Apache">Apache/Sioux: Temper Resilience</option>
            </optgroup>
        </select>

        <div class="preview-container">
            <div class="preview-title">Session Preview</div>
            <ul class="preview-list" id="previewList"></ul>
        </div>

        <button class="btn-start-workout" onclick="startWorkout()">START SESSION</button>
    </div>

    <div class="history-container" id="historyContainer">
        <button class="history-btn" onclick="toggleHistory()">
            <span>View Local Logbook</span>
            <span id="historyCount">0 Sessions</span>
        </button>
        <div id="historyPanel" style="display: none;">
            <div class="history-list" id="historyList"></div>
            <button class="btn-export" onclick="exportFullHistoryCSV()">Export All Data to CSV</button>
            <div class="history-danger">
                <button class="action-btn btn-danger" onclick="clearHistory()">Wipe Logbook</button>
            </div>
        </div>
    </div>

    <div class="card-container" id="cardContainer"></div>

    <div class="sticky-timer" id="stickyTimer">
        <div class="timer-info">
            <span class="timer-label" id="timerLabel">Workout Time</span>
            <span class="timer-display" id="timeDisplay">00:00</span>
        </div>
        <div class="timer-controls" id="timerControls">
            <button class="action-btn btn-skip" style="padding: 12px 20px; font-size: var(--fs-md);" onclick="addRest(60)">Rest 60s</button>
        </div>
    </div>

    <script>
        /* Iconography: one hand-drawn glyph set on a 24x24 grid with a 2px
           stroke. Each path uses currentColor, so a glyph inherits the colour of
           whatever badge contains it. These ids are what every exercise's
           `glyph` field points at - change an id here and every use updates. */
        const GLYPHS = {
            mobility: '<path d="M12 20.5V4"/><path d="M8.4 7.6L12 4l3.6 3.6"/><path d="M15.6 16.9L12 20.5l-3.6-3.6"/>',
            hinge:    '<path d="M4 6.5h7.5c3 0 4.5 2 4.5 4.5v7"/><path d="M12.6 15.4L16 18.8l3.4-3.4"/>',
            pull:     '<path d="M4.5 5v14"/><path d="M20 12H11"/><path d="M14 8.5L10.5 12L14 15.5"/>',
            rotation: '<circle cx="12" cy="12" r="6.5"/><path d="M12 12l4.6-4.6"/>',
            raise:    '<path d="M12 20.5v-6.5"/><path d="M12 14L6 5.5"/><path d="M12 14l6-8.5"/>',
            carry:    '<path d="M5 10.5h14v9H5z"/><path d="M9 10.5V8.6"/><path d="M15 10.5V8.6"/><path d="M9 8.6Q12 5.4 15 8.6"/>',
            lunge:    '<path d="M3 20.5h6v-5h6v-5h6"/>',
            cold:     '<path d="M12 4v16"/><path d="M5.1 8l13.8 8"/><path d="M5.1 16l13.8-8"/>',
            north:    '<path d="M3 9.5q2.2-3 4.4 0q2.2 3 4.4 0q2.2-3 4.4 0q2.2 3 4.4 0"/><path d="M3 15.5q2.2-3 4.4 0q2.2 3 4.4 0q2.2-3 4.4 0q2.2 3 4.4 0"/>',
            plains:   '<path d="M19 5c0 7-4.5 11.5-11.5 11.5C7.5 9.5 12 5 19 5z"/><path d="M16.6 7.4L8 16"/>',
            japan:    '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.4"/>',
            persia:   '<path d="M5 20.5v-8.5C5 7.5 8 5 12 5C16 5 19 7.5 19 12v8.5"/><path d="M3 20.5h18"/>',
            india:    '<path d="M12 5.5L19 19H5z"/>',
            china:    '<path d="M12 3.5l4.5 6.5h-2.7l4.2 6H6l4.2-6H7.5z"/>',
            russia:   '<circle cx="12" cy="15.4" r="5.2"/><path d="M8.8 8.8Q12 3.6 15.2 8.8"/>',
            soundOn:  '<path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15 9.5q2.5 2.5 0 5"/><path d="M18 6.5q3.5 5.5 0 11"/>',
            soundOff: '<path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/>'
        };

        /* Accessible names for each glyph. Platform emoji announced as
           "flag: Japan" or as a bare object name; these say what the badge
           actually means. */
        const GLYPH_LABELS = {
            mobility: 'Mobility reset',
            hinge: 'Hip hinge',
            pull: 'Horizontal pull',
            rotation: 'Rotation and swing',
            raise: 'Shoulder raise',
            carry: 'Loaded carry',
            lunge: 'Single-leg step and lunge',
            cold: 'Cold exposure',
            north: 'Nordic tradition',
            plains: 'Plains tradition',
            japan: 'Japanese tradition',
            persia: 'Persian tradition',
            india: 'Indian tradition',
            china: 'Chinese tradition',
            russia: 'Russian tradition',
            soundOn: 'Cue sound on',
            soundOff: 'Cue sound off'
        };

        function glyph(id) {
            const body = GLYPHS[id] || GLYPHS.mobility;
            const label = GLYPH_LABELS[id] || '';
            return `<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${label}" focusable="false">${body}</svg>`;
        }


        const exercises = {
            reset: { id: "reset", title: "Kinetic Daily Reset", glyph: "mobility", cues: "• 90-90 Hip Lift: 3x5 breaths<br>• Short-Foot: 2x20-30s/side<br>• Wall Angels: 2x10", sets: 1, reps: "5m", weight: "BW", timeSecs: 300 },
            shiko: { id: "shiko", title: "Shiko / Goblet Squat", glyph: "japan", cues: "Primary squat + hip opening.", sets: 4, reps: 8, weight: 30 },
            rdl: { id: "rdl", title: "KB RDL", glyph: "hinge", cues: "Hinge + glute dominance.", sets: 4, reps: 8, weight: 30 },
            row_a: { id: "row_a", title: "1-Arm DB Row", glyph: "pull", cues: "Horizontal pull.", sets: 4, reps: 8, weight: 25 },
            mace_a: { id: "mace_a", title: "Mace 360 / 10-to-2", glyph: "persia", cues: "Controlled rotation.", sets: 3, reps: 8, weight: 30, isOptional: true },
            bethak: { id: "bethak", title: "Bethak", glyph: "india", cues: "High-rep squat.", sets: 4, reps: 25, weight: "BW" },
            danda: { id: "danda", title: "Danda / Hindu Pushup", glyph: "india", cues: "Spinal wave + pressing strength.", sets: 4, reps: 15, weight: "BW" },
            mace_flow: { id: "mace_flow", title: "Light Mace Flow", glyph: "rotation", cues: "360 + halos + uppercuts.", sets: 3, reps: "60s", weight: 10, timeSecs: 60 },
            yt_raise: { id: "yt_raise", title: "Y/T Raise", glyph: "raise", cues: "Simple upper back raise.", sets: 2, reps: 12, weight: "BW", isOptional: true },
            carry: { id: "carry", title: "Suitcase Carry", glyph: "carry", cues: "Anti-lateral-flexion.", sets: 3, reps: "30m", weight: 30 },
            stepup: { id: "stepup", title: "Step-Up / Split Squat", glyph: "lunge", cues: "Unilateral leg strength.", sets: 3, reps: 8, weight: 25 },
            row_c: { id: "row_c", title: "1-Arm DB Row", glyph: "pull", cues: "Second weekly pull.", sets: 3, reps: 12, weight: 25 },
            yijin_jing: { id: "yijin_jing", title: "Yijin Jing Postures", glyph: "china", cues: "Long-tension postures.", sets: 2, reps: "3 br", weight: "BW", isOptional: true },
            persia_360: { id: "persia_360", title: "Heavy Mace 360°", glyph: "persia", cues: "Trace a halo.", sets: 4, reps: 15, weight: 20 },
            persia_10to2: { id: "persia_10to2", title: "Mace 10-to-2", glyph: "persia", cues: "Draw a sword.", sets: 4, reps: 10, weight: 20 },
            persia_flow: { id: "persia_flow", title: "Meel Flow Endurance", glyph: "persia", cues: "Unbroken rhythm.", sets: 1, reps: "5m", weight: 10, isOptional: true, timeSecs: 300 },
            india_danda: { id: "india_danda", title: "High-Volume Danda", glyph: "india", cues: "Pike → Dive → Scoop → Cobra.", sets: 1, reps: 50, weight: "BW" },
            india_bethak: { id: "india_bethak", title: "High-Volume Bethak", glyph: "india", cues: "Rhythmic descent.", sets: 1, reps: 100, weight: "BW" },
            india_hold: { id: "india_hold", title: "Earth Pit Isometric", glyph: "india", cues: "Low squat hold or plank.", sets: 1, reps: "60s", weight: "BW", isOptional: true, timeSecs: 60 },
            russia_swing: { id: "russia_swing", title: "Hardstyle Swings", glyph: "russia", cues: "10x10 EMOM.", sets: 10, reps: 10, weight: 30 },
            russia_breath: { id: "russia_breath", title: "Systema Box Breathing", glyph: "russia", cues: "4s Inhale, Hold, Exhale, Hold.", sets: 1, reps: "4m", weight: "BW", timeSecs: 240 },
            russia_cossack: { id: "russia_cossack", title: "Cossack Squats", glyph: "russia", cues: "Deep lateral lunges.", sets: 3, reps: 8, weight: "BW", isOptional: true },
            japan_shiko: { id: "japan_shiko", title: "Ritual Shiko Stomps", glyph: "japan", cues: "Stomp with purpose.", sets: 1, reps: 50, weight: "BW" },
            japan_goblet: { id: "japan_goblet", title: "Dohyō Goblet Squat", glyph: "japan", cues: "Root into the floor.", sets: 4, reps: 10, weight: 30 },
            japan_teppo: { id: "japan_teppo", title: "Teppo (Post Strikes)", glyph: "japan", cues: "Open palm strikes.", sets: 3, reps: 20, weight: "BW", isOptional: true },
            china_zhan: { id: "china_zhan", title: "Zhan Zhuang", glyph: "china", cues: "Stand like a pine.", sets: 1, reps: "5m", weight: "BW", timeSecs: 300 },
            china_qigong: { id: "china_qigong", title: "Qigong Flow", glyph: "china", cues: "Cloud Hands.", sets: 1, reps: "5m", weight: "BW", timeSecs: 300 },
            china_hold: { id: "china_hold", title: "Isometric Split Stance", glyph: "china", cues: "Low split stance hold.", sets: 2, reps: "60s", weight: "BW", isOptional: true, timeSecs: 60 },
            viking_carry: { id: "viking_carry", title: "Heavy Husafell/Sandbag", glyph: "north", cues: "Awkward load to chest height.", sets: 4, reps: "30m", weight: 50 },
            viking_farmer: { id: "viking_farmer", title: "Farmer's Walk", glyph: "north", cues: "Grip strength.", sets: 3, reps: "40m", weight: 40 },
            viking_cold: { id: "viking_cold", title: "Cold Exposure", glyph: "cold", cues: "Controlled stress adaptation.", sets: 1, reps: "2m", weight: "BW", isOptional: true, timeSecs: 120 },
            apache_run: { id: "apache_run", title: "Nasal-Only Endurance", glyph: "plains", cues: "Breathe nasal only.", sets: 1, reps: "20m", weight: "BW", timeSecs: 1200 },
            apache_crawl: { id: "apache_crawl", title: "Stealth Bear Crawl", glyph: "plains", cues: "Low to ground, silent.", sets: 3, reps: "20m", weight: "BW" },
            apache_breath: { id: "apache_breath", title: "Temper Resilience", glyph: "plains", cues: "Post-endurance breath regulation.", sets: 1, reps: "3m", weight: "BW", isOptional: true, timeSecs: 180 }
        };

        const workouts = {
            A: ['reset', 'shiko', 'rdl', 'row_a', 'mace_a'],
            B: ['reset', 'bethak', 'danda', 'mace_flow', 'yt_raise'],
            C: ['reset', 'carry', 'stepup', 'row_c', 'yijin_jing'],
            Persia: ['reset', 'persia_360', 'persia_10to2', 'persia_flow'],
            India: ['reset', 'india_danda', 'india_bethak', 'india_hold'],
            Russia: ['reset', 'russia_swing', 'russia_cossack', 'russia_breath'],
            Japan: ['reset', 'japan_shiko', 'japan_goblet', 'japan_teppo'],
            China: ['reset', 'china_zhan', 'china_qigong', 'china_hold'],
            Scandinavia: ['reset', 'viking_carry', 'viking_farmer', 'viking_cold'],
            Apache: ['reset', 'apache_run', 'apache_crawl', 'apache_breath']
        };

        let currentCardIndex = 0;
        let currentWorkout = [];
        let currentDayLabel = "";
        let activeReps = 0;
        let activeWeight = 0;

        let sessionLog = [];
        let workoutStartTime = 0;
        let totalRestMs = 0; 

        // Master Rest Engine
        let isResting = false;
        let currentRestStartMs = 0;
        let currentRestTargetMs = 0;
        let timerInterval = null;

        // Local Exercise Timer Engine
        let isExTimerRunning = false;
        let exTimerTotalMs = 0;
        let exTimerStartMs = 0;

        let wakeLock = null;
        let localLogbook = [];

        /* Offline: the app is three files, so the shell is cached whole and a
           page load prefers the network. That keeps "open it offline" working
           without ever pinning a user to a stale index.html. Requires HTTPS or
           localhost; silently does nothing otherwise, exactly like a browser
           that does not support it. */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        /* ---- Cue sound -----------------------------------------------------
           Audio needs a user gesture to unlock on iOS, so the context is created
           on the "Start Session" tap rather than at load. Muting is remembered,
           because a training app that beeps with no off switch is hostile. */
        let soundEnabled = localStorage.getItem('forgeSound') !== 'off';
        let audioCtx = null;

        function unlockAudio() {
            if (audioCtx) return;
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            try {
                audioCtx = new Ctx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) { audioCtx = null; }
        }

        /* Three short square-wave blips. Square is deliberate: it cuts through
           gym noise far better than a sine, at the cost of sounding like a tool
           rather than an app. */
        function beep(times) {
            if (!audioCtx || !soundEnabled) return;
            const t0 = audioCtx.currentTime;
            for (let i = 0; i < times; i++) {
                const t = t0 + i * 0.24;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.0001, t);
                gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t);
                osc.stop(t + 0.18);
            }
        }

        /* An interval boundary fires both channels on purpose: a beep is missed
           over noise, a vibration is missed through a case. If one fails in the
           environment, the other still lands. */
        function cue(times, vibratePattern) {
            beep(times);
            if (navigator.vibrate) navigator.vibrate(vibratePattern);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            localStorage.setItem('forgeSound', soundEnabled ? 'on' : 'off');
            renderSoundToggle();
            if (soundEnabled) { unlockAudio(); cue(1, 40); }
        }

        function renderSoundToggle() {
            const btn = document.getElementById('soundToggle');
            btn.innerHTML = glyph(soundEnabled ? 'soundOn' : 'soundOff');
            btn.setAttribute('aria-pressed', soundEnabled ? 'true' : 'false');
            btn.setAttribute('aria-label', soundEnabled
                ? 'Cue sound on. Activate to mute.'
                : 'Cue sound off. Activate to unmute.');
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log('Wake Lock failed:', err); }
        }

        function initApp() {
            const saved = localStorage.getItem('forgeLogbook');
            if (saved) {
                try {
                    localLogbook = JSON.parse(saved);
                    document.getElementById('historyCount').innerText = `${localLogbook.length} Sessions`;
                } catch(e) { localLogbook = []; }
            }
            document.getElementById('historyContainer').style.display = 'block';
            renderSoundToggle();
            updatePreview(); 
        }

        function updatePreview() {
            const selectEl = document.getElementById('workoutDay');
            const dayKey = selectEl.value;
            const previewList = document.getElementById('previewList');
            const plannedExercises = workouts[dayKey];

            let listHTML = '';
            plannedExercises.forEach(exKey => {
                const ex = exercises[exKey];
                const optTag = ex.isOptional ? `<span class="preview-opt">OPTIONAL</span>` : '';
                listHTML += `<li><span class="preview-origin">${glyph(ex.glyph)}</span><span><strong>${ex.title}</strong> &nbsp;<span style="color:var(--text-muted); font-size: var(--fs-base)">${ex.sets}x${ex.reps}</span></span>${optTag}</li>`;
            });
            previewList.innerHTML = listHTML;
        }

        function toggleHistory() {
            const panel = document.getElementById('historyPanel');
            const list = document.getElementById('historyList');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                if (localLogbook.length === 0) {
                    list.innerHTML = `<div class="empty-state"><img class="empty-mark" src="icon.svg" alt=""><span>No completed workouts yet.</span></div>`;
                } else {
                    list.innerHTML = localLogbook.map(w => 
                        `<div class="history-item">
                            <div><strong>${w.date}</strong> <br><span style="color:var(--text-muted)">${w.day}</span></div>
                            <div style="text-align:right">${w.totalTime}<br><span style="color:var(--accent)">${w.activeTime}</span></div>
                        </div>`
                    ).reverse().join('');
                }
            } else {
                panel.style.display = 'none';
            }
        }

        function startWorkout() {
            const selectEl = document.getElementById('workoutDay');
            const dayKey = selectEl.value;
            currentDayLabel = selectEl.options[selectEl.selectedIndex].text;

            currentWorkout = workouts[dayKey];
            currentCardIndex = 0;
            sessionLog = [];

            document.getElementById('topControls').style.display = 'none';
            document.getElementById('historyContainer').style.display = 'none';
            document.getElementById('cardContainer').style.display = 'block';
            document.getElementById('stickyTimer').style.display = 'flex';

            workoutStartTime = Date.now();
            totalRestMs = 0;
            isResting = false;
            currentRestStartMs = 0;
            currentRestTargetMs = 0;

            clearInterval(timerInterval);
            timerInterval = setInterval(onTick, 100); // Faster tick for progress bar smoothness

            unlockAudio();   // the start tap is the gesture iOS needs
            requestWakeLock();
            renderCurrentCard();
        }

        function addRest(seconds) {
            const now = Date.now();
            if (isResting) {
                currentRestTargetMs += (seconds * 1000); 
            } else {
                isResting = true;
                currentRestStartMs = now;
                currentRestTargetMs = now + (seconds * 1000); 
            }
            if(navigator.vibrate) navigator.vibrate(20);
            renderMasterTimerUI(Math.max(0, currentRestTargetMs - now) / 1000);
        }

        function stopRest() {
            if (!isResting) return;
            const now = Date.now();
            totalRestMs += (now - currentRestStartMs); 
            isResting = false;
            currentRestStartMs = 0;
            currentRestTargetMs = 0;
            if(navigator.vibrate) navigator.vibrate(20);
            renderMasterTimerUI(0);
        }

        // Local Exercise Timer Functions
        function toggleExTimer() {
            if(navigator.vibrate) navigator.vibrate(10);
            if (isExTimerRunning) {
                isExTimerRunning = false; // Pause
                document.getElementById('exTimerBtn').innerText = "Resume";
            } else {
                // If it's finished, reset it. Otherwise resume.
                const now = Date.now();
                if (exTimerStartMs === 0 || (now - exTimerStartMs >= exTimerTotalMs)) {
                    exTimerStartMs = now; // Start fresh
                } else {
                    // Resume logic: shift the start time forward by the paused duration
                    // Handled implicitly by adjusting exTimerStartMs in real implementation, but for simplicity, we just restart here if stopped.
                    exTimerStartMs = now;
                }
                isExTimerRunning = true;
                document.getElementById('exTimerBtn').innerText = "Stop";
            }
        }

        function onTick() {
            const now = Date.now();

            // 1. Update Master Rest Timer
            if (isResting) {
                const timeLeft = Math.max(0, currentRestTargetMs - now);
                if (timeLeft === 0) {
                    totalRestMs += (currentRestTargetMs - currentRestStartMs); 
                    isResting = false;
                    currentRestStartMs = 0;
                    currentRestTargetMs = 0;
                    cue(2, [200, 100, 200]);   // rest is over
                    renderMasterTimerUI(0);
                } else {
                    renderMasterTimerUI(timeLeft / 1000);
                }
            } else {
                const activeTime = now - workoutStartTime;
                renderMasterTimerUI(activeTime / 1000);
            }

            // 2. Update Local Exercise Progress Bar (if active)
            if (isExTimerRunning && exTimerTotalMs > 0) {
                const elapsed = now - exTimerStartMs;
                const remaining = Math.max(0, exTimerTotalMs - elapsed);
                const percent = Math.min(100, (elapsed / exTimerTotalMs) * 100);

                document.getElementById('exProgressFill').style.width = `${percent}%`;

                const rSecs = Math.ceil(remaining / 1000);
                const m = Math.floor(rSecs / 60).toString().padStart(2, '0');
                const s = (rSecs % 60).toString().padStart(2, '0');
                document.getElementById('exProgressTime').innerText = `${m}:${s}`;

                if (remaining === 0) {
                    isExTimerRunning = false;
                    document.getElementById('exTimerBtn').innerText = "Done";
                    cue(3, [300, 200, 300]);   // timed interval finished
                }
            }
        }

        function renderMasterTimerUI(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            document.getElementById('timeDisplay').innerText = `${m}:${s}`;

            const label = document.getElementById('timerLabel');
            const controls = document.getElementById('timerControls');

            if (isResting) {
                label.innerText = "Resting";
                label.style.color = "var(--accent)";
                controls.innerHTML = `<button class="action-btn btn-skip" style="padding: 12px; font-size: var(--fs-base);" onclick="stopRest()">Stop</button><button class="action-btn btn-skip" style="padding: 12px; font-size: var(--fs-base);" onclick="addRest(60)">+ 60s</button>`;
            } else {
                label.innerText = "Workout Time";
                label.style.color = "var(--text-muted)";
                controls.innerHTML = `<button class="action-btn btn-skip" style="padding: 12px 20px; font-size: var(--fs-md);" onclick="addRest(60)">Rest 60s</button>`;
            }
        }

        function renderCurrentCard() {
            const container = document.getElementById('cardContainer');
            const progress = document.getElementById('progressIndicator');

            // Stop any running local timer
            isExTimerRunning = false;
            exTimerTotalMs = 0;
            exTimerStartMs = 0;

            if (currentCardIndex >= currentWorkout.length) {
                progress.innerText = "Completed";
                renderSummaryCard(container);
                if (wakeLock) wakeLock.release().catch(()=>{});
                return;
            }

            progress.innerText = `${currentDayLabel} | Ex ${currentCardIndex + 1}/${currentWorkout.length}`;
            const ex = exercises[currentWorkout[currentCardIndex]];

            activeReps = ex.reps;
            activeWeight = ex.weight;

            let repFn = typeof ex.reps === 'number' ? `adjust('reps', -1)` : '';
            let repFnP = typeof ex.reps === 'number' ? `adjust('reps', 1)` : '';
            if (typeof ex.reps === 'number' && ex.reps >= 50) {
                 repFn = `adjust('reps', -5)`;
                 repFnP = `adjust('reps', 5)`;
            }

            const repsHTML = typeof ex.reps === 'number' ?
                `<div class="adj-controls">
                    <button class="adj-btn" onclick="${repFn}">-</button>
                    <span class="adj-val" id="val-reps">${activeReps}</span>
                    <button class="adj-btn" onclick="${repFnP}">+</button>
                </div>` :
                `<span class="adj-val" style="font-size: var(--fs-lg); color:var(--accent);">${ex.reps}</span>`;

            const weightHTML = typeof ex.weight === 'number' ?
                `<div class="adj-controls">
                    <button class="adj-btn" onclick="adjust('weight', -5)">-</button>
                    <span class="adj-val" id="val-weight">${activeWeight}</span>
                    <button class="adj-btn" onclick="adjust('weight', 5)">+</button>
                </div>` :
                `<span class="adj-val" style="font-size: var(--fs-lg); color:var(--accent);">${ex.weight}</span>`;

            const optionalBadge = ex.isOptional ? `<div class="badge-optional">Optional Finisher</div>` : '';

            // Progress Bar HTML logic
            let progressHTML = '';
            if (ex.timeSecs) {
                exTimerTotalMs = ex.timeSecs * 1000;
                const m = Math.floor(ex.timeSecs / 60).toString().padStart(2, '0');
                const s = (ex.timeSecs % 60).toString().padStart(2, '0');

                progressHTML = `
                    <div class="ex-progress-bg" style="display:block;">
                        <div class="ex-progress-fill" id="exProgressFill"></div>
                    </div>
                    <div class="ex-progress-controls" style="display:flex;">
                        <span class="ex-progress-time" id="exProgressTime">${m}:${s}</span>
                        <button class="ex-progress-btn" id="exTimerBtn" onclick="toggleExTimer()">Start Timer</button>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="card active">
                    <div class="card-header">
                        <div style="display:flex; flex-direction:column; gap:4px;">
                            <h3 class="exercise-title">${ex.title}</h3>
                            ${optionalBadge}
                        </div>
                        <span class="exercise-origin">${glyph(ex.glyph)}</span>
                    </div>

                    <div class="adjuster-group">
                        <div class="adjuster">
                            <span class="adj-label">Sets</span>
                            <span class="adj-val">${ex.sets}</span>
                        </div>
                        <div class="adjuster">
                            <span class="adj-label">Reps</span>
                            ${repsHTML}
                        </div>
                        <div class="adjuster">
                            <span class="adj-label">Weight</span>
                            ${weightHTML}
                        </div>
                    </div>

                    ${progressHTML}

                    <div class="cues">${ex.cues}</div>

                    <div class="actions">
                        <button class="action-btn btn-skip" onclick="logAndNext(true)">Skip</button>
                        <button class="action-btn btn-done" onclick="logAndNext(false)">Complete</button>
                    </div>
                </div>
            `;
        }

        function adjust(type, amount) {
            if(navigator.vibrate) navigator.vibrate(10);
            if (type === 'reps' && typeof activeReps === 'number') {
                activeReps = Math.max(0, activeReps + amount);
                document.getElementById('val-reps').innerText = activeReps;
            } else if (type === 'weight' && typeof activeWeight === 'number') {
                activeWeight = Math.max(0, activeWeight + amount);
                document.getElementById('val-weight').innerText = activeWeight;
            }
        }

        function logAndNext(skipped) {
            const ex = exercises[currentWorkout[currentCardIndex]];
            if (!skipped) {
                sessionLog.push({
                    exercise: ex.title,
                    sets: ex.sets,
                    reps: activeReps,
                    weight: activeWeight
                });

                if (currentCardIndex < currentWorkout.length - 1) {
                    if (isResting) stopRest(); 
                    addRest(60);
                }
            }
            currentCardIndex++;
            renderCurrentCard();
        }

        /* The day's signature glyph for the summary watermark. Most-used glyph
           wins, because a heritage day repeats its tradition three times. On a
           tie a pattern beats a tradition - Day A inherits the Japanese ring
           from the shared Shiko squat, and a ring on a strength day would
           misdescribe the session. */
        const TRADITION_GLYPHS = ['persia', 'india', 'japan', 'china', 'russia', 'north', 'plains'];

        function dayGlyphId() {
            const counts = {};
            currentWorkout.forEach(key => {
                const id = exercises[key].glyph;
                if (id !== 'mobility') counts[id] = (counts[id] || 0) + 1;
            });
            const ids = Object.keys(counts);
            if (ids.length === 0) return 'mobility';
            return ids.sort((a, b) =>
                (counts[b] - counts[a]) ||
                (TRADITION_GLYPHS.includes(a) - TRADITION_GLYPHS.includes(b))
            )[0];
        }

        function renderSummaryCard(container) {
            if (isResting) stopRest(); 
            clearInterval(timerInterval); 

            const totalMs = Date.now() - workoutStartTime;
            const finalTotalSecs = Math.floor(totalMs / 1000);
            const finalRestSecs = Math.floor(totalRestMs / 1000);
            const finalActiveSecs = Math.max(0, finalTotalSecs - finalRestSecs); 

            const fmt = (secs) => `${Math.floor(secs / 60)}m ${secs % 60}s`;

            // Ensure no invalid state breaks the save
            try {
                const dateStrLocal = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                localLogbook.push({
                    date: dateStrLocal,
                    day: currentDayLabel,
                    totalTime: fmt(finalTotalSecs),
                    activeTime: fmt(finalActiveSecs),
                    restTime: fmt(finalRestSecs),
                    logs: sessionLog
                });
                localStorage.setItem('forgeLogbook', JSON.stringify(localLogbook));
            } catch (e) {
                console.error("Failed to save logbook", e);
            }

            let tableRows = sessionLog.map(log => 
                `<tr><td>${log.exercise}</td><td>${log.sets}×${log.reps}</td><td>${log.weight}</td></tr>`
            ).join('');

            container.innerHTML = `
                <div class="card active" style="border-color: var(--accent)">
                    <div class="card-watermark">${glyph(dayGlyphId())}</div>
                    <h3 style="margin-top:0; color:var(--text); font-size: var(--fs-xl)">Workout Logged</h3>
                    <p style="color:var(--text-muted); font-size: var(--fs-base); margin-top:-10px;">Saved to internal logbook.</p>

                    <div class="summary-stats">
                        <div class="stat-box">
                            <div class="stat-label">Total Time</div>
                            <div class="stat-value">${fmt(finalTotalSecs)}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Active Time</div>
                            <div class="stat-value" style="color:var(--accent)">${fmt(finalActiveSecs)}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Rest Time</div>
                            <div class="stat-value">${fmt(finalRestSecs)}</div>
                        </div>
                    </div>
                    <table class="summary-table">
                        <thead><tr><th>Exercise</th><th>Set×Rep</th><th>Weight</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                    <button class="action-btn btn-skip" style="width:100%; margin-top:20px" onclick="location.reload()">Finish & Return Home</button>
                </div>
            `;
            document.getElementById('stickyTimer').style.display = 'none';
        }

        function exportFullHistoryCSV() {
            if (localLogbook.length === 0) return alert("No data to export.");

            let csv = "Date,Workout,Total Time,Active Time,Rest Time,Exercise,Sets,Reps,Weight\n";

            localLogbook.forEach(session => {
                session.logs.forEach(log => {
                    csv += `"${session.date}","${session.day}","${session.totalTime}","${session.activeTime}","${session.restTime}","${log.exercise}",${log.sets},${log.reps},${log.weight}\n`;
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            const dateStr = new Date().toISOString().split('T')[0];
            link.setAttribute("download", `forge_lifetime_log_${dateStr}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearHistory() {
            if (confirm("Are you sure you want to permanently delete all workout history?")) {
                localStorage.removeItem('forgeLogbook');
                localLogbook = [];
                toggleHistory(); 
                initApp(); 
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && wakeLock === null && document.getElementById('stickyTimer').style.display !== 'none') {
                requestWakeLock();
            }
        });

        initApp();
    </script>
</body>
